  <!-- ===== STRUCTURED DATA: SoftwareApplication ===== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Ankard",
    "url": "https://ankard.com/",
    "logo": "https://ankard.com/img/logoanko.png",
    "description": "Ankard is an AI-powered employee training and knowledge management platform. Companies turn manuals, policies, and procedures into structured training, learning paths, and assessments, and track employee progress.",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "inLanguage": [
      "en",
      "es"
    ],
    "offers": [
      {
        "@type": "Offer",
        "name": "Ankard Business Pilot",
        "price": "99",
        "priceCurrency": "USD",
        "description": "30-day business pilot for up to 5 employees, with a 30-day satisfaction guarantee."
      },
      {
        "@type": "Offer",
        "name": "Ankard Business",
        "price": "149",
        "priceCurrency": "USD",
        "description": "Monthly subscription.",
        "priceSpecification": {
          "@type": "UnitPriceSpecification",
          "price": "149",
          "priceCurrency": "USD",
          "unitCode": "MON"
        }
      }
    ],
    "featureList": [
      "Turn business documents into employee training with AI assistance",
      "Learning paths by department, role, or responsibility",
      "Employee invitations and training assignments",
      "Assessments to verify understanding",
      "Training progress and assessment results",
      "Document version history and procedure updates",
      "Internal completion certificates with verification link",
      "Private company workspaces with roles and permissions"
    ],
    "screenshot": "https://ankard.com/img/anko-hero.png",
    "publisher": {
      "@type": "Organization",
      "name": "Ankard",
      "url": "https://ankard.com/",
      "logo": "https://ankard.com/img/logoanko.png",
      "sameAs": [
        "https://twitter.com/ankardapp"
      ]
    }
  }
  </script>

  <!-- ===== STRUCTURED DATA: FAQPage (mirrors the landing FAQ, English) ===== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is Ankard Enterprise?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Ankard is an AI-assisted business knowledge management and employee training platform. It helps companies organize documents, create learning materials, assign training, and monitor learning progress."
        }
      },
      {
        "@type": "Question",
        "name": "Can Ankard turn business documents into employee training?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Ankard helps transform manuals, policies, and procedures into structured learning content, questions, and assessments. Your team can review and adjust the content before assigning it."
        }
      },
      {
        "@type": "Question",
        "name": "Can I assign different training to different employees?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. You can organize learning paths and assign training based on each employee's role and responsibilities."
        }
      },
      {
        "@type": "Question",
        "name": "Can I monitor employee training progress?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Authorized administrators can review participation, progress, and assessment results."
        }
      },
      {
        "@type": "Question",
        "name": "Are my company documents private?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Each company works in its own private workspace. Only people your company invites can access it, and administrators control what each person can do through roles and permissions. If you have specific data-handling questions, our team will walk you through them."
        }
      },
      {
        "@type": "Question",
        "name": "Does Ankard issue certificates?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Ankard provides internal completion and assessment records, including certificates that can be checked with a verification link. They do not replace professional licenses or regulated certifications."
        }
      },
      {
        "@type": "Question",
        "name": "How much does Ankard cost?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The 30-day business pilot costs $99 for up to five employees. After that, the Ankard Business subscription is $149 per month."
        }
      },
      {
        "@type": "Question",
        "name": "How do I start the pilot?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Fill out the pilot request form. Our team will contact you to confirm the details, set up your workspace, and arrange payment."
        }
      },
      {
        "@type": "Question",
        "name": "Is there a money-back guarantee?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. The pilot includes a 30-day satisfaction guarantee with a full refund."
        }
      },
      {
        "@type": "Question",
        "name": "Can Ankard work for my industry?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Ankard is designed for organizations across industries that need to organize knowledge and train employees."
        }
      }
    ]
  }
  </script>
